<svg width="40" height="40" viewBox="1 1 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.ring{transform-origin:26px 26px;animation:spin 14s linear infinite}
.toe{animation:hop 2.8s ease-in-out infinite}
.t2{animation-delay:.12s}.t3{animation-delay:.24s}.t4{animation-delay:.36s}
.heart{transform-box:fill-box;transform-origin:50% 55%;animation:beat 2.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hop{0%,55%,100%{translate:0 0}18%{translate:0 -1.8px}34%{translate:0 0}}
@keyframes beat{0%,100%{scale:1}12%{scale:1.14}24%{scale:1}36%{scale:1.08}48%{scale:1}}
@media (prefers-reduced-motion:reduce){.ring,.toe,.heart{animation:none}}
</style>
<circle cx="26" cy="26" r="24" fill="#EB6753"/>
<circle class="ring" cx="26" cy="26" r="20" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 3.2" fill="none"/>
<g fill="#FFFFFF">
<g class="toe t1"><ellipse cx="15.6" cy="21" rx="3.1" ry="3.9" transform="rotate(-18 15.6 21)"/></g>
<g class="toe t2"><ellipse cx="21.6" cy="15" rx="3.3" ry="4.3" transform="rotate(-6 21.6 15)"/></g>
<g class="toe t3"><ellipse cx="30.4" cy="15" rx="3.3" ry="4.3" transform="rotate(6 30.4 15)"/></g>
<g class="toe t4"><ellipse cx="36.4" cy="21" rx="3.1" ry="3.9" transform="rotate(18 36.4 21)"/></g>
<path class="heart" d="M26 38.6C18.6 33.6 15.6 29.3 18.3 25.6C20.6 22.6 24.3 23.1 26 25.9C27.7 23.1 31.4 22.6 33.7 25.6C36.4 29.3 33.4 33.6 26 38.6Z"/>
</g>
</svg>
